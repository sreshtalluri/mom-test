name: Check skills distribution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh -n install.sh
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null
      - run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
